<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password – Pedyo</title>
<link href="/assets/images/logo/pedyo-mark.svg" rel="icon" type="image/svg+xml"/>
<link href="/assets/css/reset.css" rel="stylesheet"/>
<link href="/assets/css/tokens.css" rel="stylesheet"/>
<link href="/assets/css/components.css" rel="stylesheet"/>
<link href="/assets/css/layout.css" rel="stylesheet"/>
<link href="/assets/css/pages.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card">
<div class="auth-logo"><a href="/" class="logo"><img alt="" class="logo-mark" src="/assets/images/logo/pedyo-mark.svg"/><span class="logo-word">Pedyo</span></a></div>
<h1 class="auth-title">Reset your password</h1>
<p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
<div id="auth-alert"></div>
<form class="auth-form" id="forgot-form">
<div class="form-group">
<label class="form-label" for="email">Email address</label>
<input autocomplete="email" class="form-input" id="email" placeholder="you@example.com" required="" type="email"/>
</div>
<button class="btn btn-primary w-full" id="forgot-btn" type="submit">Send Reset Link</button>
</form>
<p class="auth-footer"><a href="/account/login.html">← Back to Sign In</a></p>
</div>
</div>
<script type="module">
    import { resetPassword } from '/assets/js/auth.js';
    import { showAlert, setLoading } from '/assets/js/ui.js';
    document.getElementById('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('forgot-btn');
      const alertEl = document.getElementById('auth-alert');
      setLoading(btn, true, 'Sending…');
      try {
        await resetPassword(document.getElementById('email').value.trim());
        showAlert(alertEl, 'Reset link sent! Check your email.', 'success');
      } catch (err) {
        showAlert(alertEl, err.message || 'Failed to send reset link.');
      } finally {
        setLoading(btn, false, 'Send Reset Link');
      }
    });
  </script>
</body>
</html>
