<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automotive – Pedyo</title>
  <link rel="icon" href="/assets/images/logo/pedyo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body class="page-wrapper">
  <div id="nav-placeholder"></div>
  <main class="main-content">
    <div class="page-hero">
      <div style="color:var(--green);margin-bottom:12px"><svg class="icon icon-car" xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" /><circle cx="7" cy="17" r="2" /><path d="M9 17h6" /><circle cx="17" cy="17" r="2" /></svg></div>
      <h1>Automotive</h1>
      <p>Find trusted Automotive providers near you in Harare and Chitungwiza</p>
    </div>
    <section class="section">
      <div class="container">
        <div id="providers-grid" class="grid-auto">
          <div style="text-align:center;padding:40px;grid-column:1/-1"><div class="spinner" style="margin:0 auto"></div></div>
        </div>
        <div id="empty-state" class="empty-state hidden">
          <p>No providers available yet in this category.</p>
          <a href="/account/become-provider.html" class="btn btn-primary" style="margin-top:16px">Be the first provider</a>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module">
    import { renderNav, renderFooter } from '/assets/js/nav-html.js';
    import { initNav } from '/assets/js/nav.js';
    import { searchProviders, renderProviderCard } from '/assets/js/providers.js';
    document.getElementById('nav-placeholder').innerHTML = renderNav('services');
    document.getElementById('footer-placeholder').innerHTML = renderFooter();
    initNav();
    const { providers } = await searchProviders({ category: 'Automotive', limit: 24 });
    const grid = document.getElementById('providers-grid');
    if (providers.length) {
      grid.innerHTML = providers.map(p => renderProviderCard(p)).join('');
    } else {
      grid.innerHTML = '';
      document.getElementById('empty-state').classList.remove('hidden');
    }
  </script>
</body>
</html>
