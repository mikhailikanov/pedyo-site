<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events – Pedyo</title>
  <link rel="icon" href="/assets/images/logo/pedyo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body class="page-wrapper">
  <div id="nav-placeholder"></div>
  <main class="main-content">
    <div class="page-hero">
      <div style="color:var(--green);margin-bottom:12px"><svg class="icon icon-party-popper" xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.8 11.3 2 22l10.7-3.79" /><path d="M4 3h.01" /><path d="M22 8h.01" /><path d="M15 2h.01" /><path d="M22 20h.01" /><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10" /><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17" /><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7" /><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z" /></svg></div>
      <h1>Events</h1>
      <p>Find trusted Events providers near you in Harare and Chitungwiza</p>
    </div>
    <section class="section">
      <div class="container">
        <div id="providers-grid" class="grid-auto">
          <div style="text-align:center;padding:40px;grid-column:1/-1"><div class="spinner" style="margin:0 auto"></div></div>
        </div>
        <div id="empty-state" class="empty-state hidden">
          <p>No providers available yet in this category.</p>
          <a href="/account/become-provider.html" class="btn btn-primary" style="margin-top:16px">Be the first provider</a>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module">
    import { renderNav, renderFooter } from '/assets/js/nav-html.js';
    import { initNav } from '/assets/js/nav.js';
    import { searchProviders, renderProviderCard } from '/assets/js/providers.js';
    document.getElementById('nav-placeholder').innerHTML = renderNav('services');
    document.getElementById('footer-placeholder').innerHTML = renderFooter();
    initNav();
    const { providers } = await searchProviders({ category: 'Events', limit: 24 });
    const grid = document.getElementById('providers-grid');
    if (providers.length) {
      grid.innerHTML = providers.map(p => renderProviderCard(p)).join('');
    } else {
      grid.innerHTML = '';
      document.getElementById('empty-state').classList.remove('hidden');
    }
  </script>
</body>
</html>
