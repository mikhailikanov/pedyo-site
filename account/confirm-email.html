<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirm Email – Pedyo</title>
<link href="/assets/images/logo/pedyo-mark.svg" rel="icon" type="image/svg+xml"/>
<link href="/assets/css/reset.css" rel="stylesheet"/>
<link href="/assets/css/tokens.css" rel="stylesheet"/>
<link href="/assets/css/components.css" rel="stylesheet"/>
<link href="/assets/css/layout.css" rel="stylesheet"/>
<link href="/assets/css/pages.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card" style="text-align:center">
<div class="auth-logo"><a href="/" class="logo"><img alt="" class="logo-mark" src="/assets/images/logo/pedyo-mark.svg"/><span class="logo-word">Pedyo</span></a></div>
<div style="font-size:3rem;margin-bottom:16px">📧</div>
<h1 class="auth-title">Check your email</h1>
<p class="auth-subtitle">We've sent a confirmation link to your email address. Click the link to activate your account.</p>
<div style="background:var(--color-bg);border-radius:12px;padding:20px;margin:24px 0;font-size:0.875rem;color:var(--color-text-muted);line-height:1.7">
<p>Didn't receive the email? Check your spam folder, or <button id="resend-btn" style="background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-size:inherit">resend the confirmation email</button>.</p>
</div>
<div id="resend-alert"></div>
<a class="btn btn-primary w-full" href="/account/login.html">Back to Sign In</a>
</div>
</div>
<script type="module">
    import { supabase } from '/assets/js/supabase-client.js';
    import { showAlert } from '/assets/js/ui.js';
    document.getElementById('resend-btn').addEventListener('click', async () => {
      const alertEl = document.getElementById('resend-alert');
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { showAlert(alertEl, 'Please sign in first.'); return; }
        await supabase.auth.resend({ type: 'signup', email: user.email });
        showAlert(alertEl, 'Confirmation email resent!', 'success');
      } catch (err) {
        showAlert(alertEl, 'Failed to resend. Please try again.');
      }
    });
  </script>
</body>
</html>
