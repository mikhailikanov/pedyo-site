<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password – Pedyo</title>
<link href="/assets/images/logo/pedyo-mark.svg" rel="icon" type="image/svg+xml"/>
<link href="/assets/css/reset.css" rel="stylesheet"/>
<link href="/assets/css/tokens.css" rel="stylesheet"/>
<link href="/assets/css/components.css" rel="stylesheet"/>
<link href="/assets/css/layout.css" rel="stylesheet"/>
<link href="/assets/css/pages.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card">
<div class="auth-logo"><a href="/" class="logo"><img alt="" class="logo-mark" src="/assets/images/logo/pedyo-mark.svg"/><span class="logo-word">Pedyo</span></a></div>
<h1 class="auth-title">Set new password</h1>
<p class="auth-subtitle">Choose a strong password for your account.</p>
<div id="auth-alert"></div>
<form class="auth-form" id="reset-form">
<div class="form-group">
<label class="form-label" for="password">New password</label>
<input autocomplete="new-password" class="form-input" id="password" minlength="8" placeholder="At least 8 characters" required="" type="password"/>
</div>
<div class="form-group">
<label class="form-label" for="confirm-password">Confirm new password</label>
<input autocomplete="new-password" class="form-input" id="confirm-password" placeholder="Repeat your password" required="" type="password"/>
</div>
<button class="btn btn-primary w-full" id="reset-btn" type="submit">Update Password</button>
</form>
</div>
</div>
<script type="module">
    import { updatePassword } from '/assets/js/auth.js';
    import { showAlert, setLoading } from '/assets/js/ui.js';
    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      const alertEl = document.getElementById('auth-alert');
      const pw  = document.getElementById('password').value;
      const cpw = document.getElementById('confirm-password').value;
      if (pw !== cpw) { showAlert(alertEl, 'Passwords do not match.'); return; }
      setLoading(btn, true, 'Updating…');
      try {
        await updatePassword(pw);
        showAlert(alertEl, 'Password updated! Redirecting…', 'success');
        setTimeout(() => window.location.href = '/', 2000);
      } catch (err) {
        showAlert(alertEl, err.message || 'Failed to update password.');
        setLoading(btn, false, 'Update Password');
      }
    });
  </script>
</body>
</html>
